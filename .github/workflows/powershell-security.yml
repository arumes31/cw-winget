name: PowerShell security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: Analyze and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pinned analysis tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem update-all, update-single-app -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "$($parseErrors.Count) PowerShell parse error(s) found."
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path update-all -Recurse -Severity Error
          $findings += Invoke-ScriptAnalyzer -Path update-single-app -Recurse -Severity Error
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) {
            throw "$($findings.Count) blocking PSScriptAnalyzer finding(s) found."
          }

      - name: Run security regression tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "tests"
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $configuration

      - name: Validate script signatures
        shell: pwsh
        run: |
          $invalid = Get-ChildItem update-all, update-single-app -Filter *.ps1 |
            Get-AuthenticodeSignature |
            Where-Object Status -NotIn Valid, NotSigned
          $invalid | Format-Table -AutoSize
          if ($invalid.Count -gt 0) {
            throw "$($invalid.Count) invalid Authenticode signature(s) found."
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
